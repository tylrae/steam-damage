<!doctype html>
<html><head><meta charset="utf-8">
<base href="../src/">
<!-- Makes src/og.png, the link preview. Render at exactly 1200x630:
     chrome --headless=new --allow-file-access-from-files --hide-scrollbars --window-size=1200,630 --screenshot=src/og.png tools/og-image.html -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1d1c1a; }
  .wrap { position: relative; width: 1200px; height: 630px; font-family: system-ui, "Segoe UI", sans-serif; color: #efede6; }
  .brand { position: absolute; left: 64px; top: 46px; }
  /* Same logo as the site header (styles.css .logo), drawn larger. */
  .logo { position: relative; display: inline-block; padding: 11px 22px 19px; background: #fffdf7; line-height: 1;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), 95% 100%, 90% calc(100% - 8px), 85% 100%, 80% calc(100% - 8px), 75% 100%, 70% calc(100% - 8px), 65% 100%, 60% calc(100% - 8px), 55% 100%, 50% calc(100% - 8px), 45% 100%, 40% calc(100% - 8px), 35% 100%, 30% calc(100% - 8px), 25% 100%, 20% calc(100% - 8px), 15% 100%, 10% calc(100% - 8px), 5% 100%, 0 calc(100% - 8px)); }
  .logo .ln { position: absolute; height: 3px; background: #cfcabd; border-radius: 1px; }
  .logo .ln-top { left: 22px; top: 6px; width: 38%; }
  .logo .ln-bot { right: 22px; bottom: 13px; width: 44%; }
  .logo-stamp { display: block; position: relative; font: 800 25px "Cascadia Mono", Consolas, monospace; letter-spacing: .12em; color: #d6452f; border: 4px solid #d6452f; outline: 1.5px solid #d6452f; outline-offset: 3px; border-radius: 4px; padding: 6px 14px 5px; white-space: nowrap; transform: rotate(-4deg); }
  h1 { position: absolute; left: 64px; top: 150px; width: 620px; margin: 0; font-size: 66px; line-height: 1.08; font-weight: 800; }
  h1 em { font-style: normal; color: #ef5a42; }
  .sub { position: absolute; left: 64px; top: 435px; width: 600px; margin: 0; font-size: 27px; line-height: 1.35; color: #b5b1a6; }
  .url { position: absolute; left: 64px; bottom: 56px; font: 700 26px "Cascadia Mono", Consolas, monospace; color: #efede6; }
  canvas { position: absolute; right: 70px; top: 22px; width: 400px; transform: rotate(3deg); }
</style></head>
<body><div class="wrap">
  <div class="brand"><span class="logo"><i class="ln ln-top"></i><span class="logo-stamp">STEAM DAMAGE</span><i class="ln ln-bot"></i></span></div>
  <h1>How much have you <em>actually</em> spent on Steam?</h1>
  <p class="sub">Paste your Steam purchase history and see where the money went, game by game.</p>
  <div class="url">steamdamage.com</div>
  <canvas id="c"></canvas>
</div>
<script src="cards.js"></script>
<script>
  // Made-up numbers for the preview, not anyone's real history.
  const full = document.createElement('canvas');
  WalletCards.draw(full, { id: 'total', alt: 'sample', blocks: [
    { type: 'kicker', text: 'The damage' },
    { type: 'big', text: 'US$2,847.60' },
    { type: 'text', text: 'on 63 games since Jun 2014.' },
    { type: 'gap' },
    { type: 'lines', rows: [['Games & DLC', 'US$1,912.35'], ['Microtransactions', 'US$1,021.79'], ['Refunded', '-US$86.54']], total: ['Total', 'US$2,847.60'] },
  ] }, { index: 0, count: 12 });
  // Crop to the paper from the top teeth down to the address line, then scale into the preview.
  const c = document.getElementById('c'), cropTop = 150, h = 1440;
  c.width = 1080; c.height = h;
  c.getContext('2d').drawImage(full, 0, cropTop, 1080, h, 0, 0, 1080, h);
</script>
</body></html>
